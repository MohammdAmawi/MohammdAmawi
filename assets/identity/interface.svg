<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="215" viewBox="0 0 1200 215" role="img" aria-label="Modern Login UI — Visual structure · Frontend practice"><title>Modern Login UI — Visual structure · Frontend practice</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#608090" opacity=".14"/></pattern><linearGradient id="fade"><stop stop-color="#16323c"/><stop offset="1" stop-color="#0a1018"/></linearGradient></defs><style>.pulse{animation:pulse 4s ease-in-out infinite}.flow{stroke-dasharray:8 40;animation:flow 9s linear infinite}.cursor{animation:pulse 2s steps(2,end) infinite}@keyframes pulse{50%{opacity:.3}}@keyframes flow{to{stroke-dashoffset:-192}}@media(prefers-reduced-motion:reduce){.pulse,.flow,.cursor{animation:none}}</style><rect width="1200" height="215" rx="20" fill="#0a1018"/><rect x="1" y="1" width="1198" height="213" rx="20" stroke="#283b49" fill="none"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="40" fill="#89b8ee" font-size="13" font-weight="650" letter-spacing="1.2">02 / INTERFACE DESIGN</text><text x="36" y="90" fill="#edf3f4" font-size="34" font-weight="700" >Modern Login UI</text><text x="36" y="129" fill="#9eafb9" font-size="20" font-weight="400" >A focused exploration of layout and form presentation.</text><text x="36" y="183" fill="#edf3f4" font-size="18" font-weight="400" >Visual structure · Frontend practice</text><text x="973" y="184" fill="#89b8ee" font-size="14" font-weight="650" >VIEW SOURCE ↗</text><path d="M925 28L925 143" stroke="#283b49" fill="none" /><rect x="967" y="29" width="192" height="108" rx="7" fill="#0c1620" stroke="#283b49"/><rect x="1000" y="46" width="124" height="17" rx="4" fill="#1d303e" stroke="#283b49"/><rect x="1000" y="73" width="124" height="17" rx="4" fill="#1d303e" stroke="#283b49"/><rect x="1000" y="100" width="124" height="16" rx="4" fill="#89b8ee" stroke="#89b8ee"/></g></svg>