<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="347" viewBox="0 0 1200 347" role="img" aria-label="Technical Mentor at NASA Space Apps Irbid; member of Breakers Team"><title>Technical Mentor at NASA Space Apps Irbid; member of Breakers Team</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#608090" opacity=".14"/></pattern><linearGradient id="fade"><stop stop-color="#16323c"/><stop offset="1" stop-color="#0a1018"/></linearGradient></defs><style>.pulse{animation:pulse 4s ease-in-out infinite}.flow{stroke-dasharray:8 40;animation:flow 9s linear infinite}.cursor{animation:pulse 2s steps(2,end) infinite}@keyframes pulse{50%{opacity:.3}}@keyframes flow{to{stroke-dashoffset:-192}}@media(prefers-reduced-motion:reduce){.pulse,.flow,.cursor{animation:none}}</style><rect width="1200" height="347" rx="20" fill="#0a1018"/><rect x="1" y="1" width="1198" height="345" rx="20" stroke="#283b49" fill="none"/><g font-family="Segoe UI,Arial,sans-serif"><text x="42" y="43" fill="#6ee7c7" font-size="14" font-weight="650" letter-spacing="1.6">04 / COMMUNITY &amp; CONTRIBUTION</text><text x="42" y="92" fill="#edf3f4" font-size="35" font-weight="700" >Better systems start with shared understanding.</text><rect x="42" y="133" width="550" height="186" rx="12" fill="#101c28" stroke="#283b49"/><text x="66" y="170" fill="#6ee7c7" font-size="13" font-weight="650" letter-spacing="1.1">TECHNICAL MENTOR</text><text x="66" y="213" fill="#edf3f4" font-size="29" font-weight="700" >NASA Space Apps Irbid</text><text x="66" y="250" fill="#9eafb9" font-size="20" font-weight="400" >Supporting the local challenge community.</text><text x="66" y="288" fill="#edf3f4" font-size="17" font-weight="400" >Technical guidance · Project planning</text><rect x="606" y="133" width="550" height="186" rx="12" fill="#101c28" stroke="#283b49"/><text x="630" y="170" fill="#89b8ee" font-size="13" font-weight="650" letter-spacing="1.1">TEAM MEMBER</text><text x="630" y="213" fill="#edf3f4" font-size="29" font-weight="700" >Breakers Team</text><text x="630" y="250" fill="#9eafb9" font-size="20" font-weight="400" >Learning and solving problems together.</text><text x="630" y="288" fill="#edf3f4" font-size="17" font-weight="400" >Collaboration · Technical learning</text></g></svg>