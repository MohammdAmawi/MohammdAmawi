<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="184" viewBox="0 0 1200 184" role="img" aria-label="Open to internships, student collaboration, and technical conversations"><title>Open to internships, student collaboration, and technical conversations</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#608090" opacity=".14"/></pattern><linearGradient id="fade"><stop stop-color="#16323c"/><stop offset="1" stop-color="#0a1018"/></linearGradient></defs><style>.pulse{animation:pulse 4s ease-in-out infinite}.flow{stroke-dasharray:8 40;animation:flow 9s linear infinite}.cursor{animation:pulse 2s steps(2,end) infinite}@keyframes pulse{50%{opacity:.3}}@keyframes flow{to{stroke-dashoffset:-192}}@media(prefers-reduced-motion:reduce){.pulse,.flow,.cursor{animation:none}}</style><rect width="1200" height="184" rx="20" fill="#0a1018"/><rect x="1" y="1" width="1198" height="182" rx="20" stroke="#283b49" fill="none"/><g font-family="Segoe UI,Arial,sans-serif"><text x="42" y="52" fill="#6ee7c7" font-size="14" font-weight="650" letter-spacing="1.5">LET'S CONNECT</text><text x="42" y="103" fill="#edf3f4" font-size="31" font-weight="650" >A clear problem. A useful project. A chance to contribute.</text><text x="42" y="148" fill="#9eafb9" font-size="21" font-weight="400" >Open to internships, student collaborations, and technical conversations.</text></g></svg>