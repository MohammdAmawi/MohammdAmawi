<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="215" viewBox="0 0 1200 215" role="img" aria-label="Score Keeper — State transitions · User interaction"><title>Score Keeper — State transitions · User interaction</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#608090" opacity=".14"/></pattern><linearGradient id="fade"><stop stop-color="#16323c"/><stop offset="1" stop-color="#0a1018"/></linearGradient></defs><style>.pulse{animation:pulse 4s ease-in-out infinite}.flow{stroke-dasharray:8 40;animation:flow 9s linear infinite}.cursor{animation:pulse 2s steps(2,end) infinite}@keyframes pulse{50%{opacity:.3}}@keyframes flow{to{stroke-dashoffset:-192}}@media(prefers-reduced-motion:reduce){.pulse,.flow,.cursor{animation:none}}</style><rect width="1200" height="215" rx="20" fill="#0a1018"/><rect x="1" y="1" width="1198" height="213" rx="20" stroke="#283b49" fill="none"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="40" fill="#6ee7c7" font-size="13" font-weight="650" letter-spacing="1.2">01 / APPLICATION LOGIC</text><text x="36" y="90" fill="#edf3f4" font-size="34" font-weight="700" >Score Keeper</text><text x="36" y="129" fill="#9eafb9" font-size="20" font-weight="400" >Configurable scores, winning states, and reset behavior.</text><text x="36" y="183" fill="#edf3f4" font-size="18" font-weight="400" >State transitions · User interaction</text><text x="973" y="184" fill="#6ee7c7" font-size="14" font-weight="650" >VIEW SOURCE ↗</text><path d="M925 28L925 143" stroke="#283b49" fill="none" /><rect x="967" y="29" width="192" height="108" rx="7" fill="#0c1620" stroke="#283b49"/><text x="1000" y="96" fill="#6ee7c7" font-size="36" font-weight="600" >02</text><text x="1064" y="94" fill="#9eafb9" font-size="28" font-weight="400" >:</text><text x="1091" y="96" fill="#edf3f4" font-size="36" font-weight="600" >01</text></g></svg>