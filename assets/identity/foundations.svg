<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="504" viewBox="0 0 1200 504" role="img" aria-label="Strengths: Requirements Engineering, Software Modeling, System Design, Database Design"><title>Strengths: Requirements Engineering, Software Modeling, System Design, Database Design</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#608090" opacity=".14"/></pattern><linearGradient id="fade"><stop stop-color="#16323c"/><stop offset="1" stop-color="#0a1018"/></linearGradient></defs><style>.pulse{animation:pulse 4s ease-in-out infinite}.flow{stroke-dasharray:8 40;animation:flow 9s linear infinite}.cursor{animation:pulse 2s steps(2,end) infinite}@keyframes pulse{50%{opacity:.3}}@keyframes flow{to{stroke-dashoffset:-192}}@media(prefers-reduced-motion:reduce){.pulse,.flow,.cursor{animation:none}}</style><rect width="1200" height="504" rx="20" fill="#0a1018"/><rect x="1" y="1" width="1198" height="502" rx="20" stroke="#283b49" fill="none"/><g font-family="Segoe UI,Arial,sans-serif"><text x="42" y="43" fill="#6ee7c7" font-size="14" font-weight="650" letter-spacing="1.6">01 / ENGINEERING FOUNDATIONS</text><text x="42" y="91" fill="#edf3f4" font-size="38" font-weight="700" >From a problem to a system.</text><text x="42" y="130" fill="#9eafb9" font-size="21" font-weight="400" >My strengths are in analysis, modeling, and design.</text><rect x="42" y="166" width="550" height="145" rx="12" fill="#101c28" stroke="#283b49"/><text x="65" y="201" fill="#6ee7c7" font-size="15" font-weight="700" >01</text><text x="105" y="203" fill="#edf3f4" font-size="25" font-weight="650" >Requirements Engineering</text><path d="M65 222L566 222" stroke="#283b49" fill="none" /><text x="65" y="254" fill="#9eafb9" font-size="20" font-weight="400" >Clarify needs. Define requirements.</text><text x="65" y="285" fill="#9eafb9" font-size="20" font-weight="400" >Build a shared understanding.</text><rect x="606" y="166" width="550" height="145" rx="12" fill="#101c28" stroke="#283b49"/><text x="629" y="201" fill="#6ee7c7" font-size="15" font-weight="700" >02</text><text x="669" y="203" fill="#edf3f4" font-size="25" font-weight="650" >Software Modeling</text><path d="M629 222L1130 222" stroke="#283b49" fill="none" /><text x="629" y="254" fill="#9eafb9" font-size="20" font-weight="400" >Represent structure and behavior.</text><text x="629" y="285" fill="#9eafb9" font-size="20" font-weight="400" >Make complex ideas easier to discuss.</text><rect x="42" y="326" width="550" height="145" rx="12" fill="#101c28" stroke="#283b49"/><text x="65" y="361" fill="#6ee7c7" font-size="15" font-weight="700" >03</text><text x="105" y="363" fill="#edf3f4" font-size="25" font-weight="650" >System Design</text><path d="M65 382L566 382" stroke="#283b49" fill="none" /><text x="65" y="414" fill="#9eafb9" font-size="20" font-weight="400" >Organize components and interactions.</text><text x="65" y="445" fill="#9eafb9" font-size="20" font-weight="400" >Connect decisions to requirements.</text><rect x="606" y="326" width="550" height="145" rx="12" fill="#101c28" stroke="#283b49"/><text x="629" y="361" fill="#6ee7c7" font-size="15" font-weight="700" >04</text><text x="669" y="363" fill="#edf3f4" font-size="25" font-weight="650" >Database Design</text><path d="M629 382L1130 382" stroke="#283b49" fill="none" /><text x="629" y="414" fill="#9eafb9" font-size="20" font-weight="400" >Structure data and relationships.</text><text x="629" y="445" fill="#9eafb9" font-size="20" font-weight="400" >Give information a coherent foundation.</text></g></svg>