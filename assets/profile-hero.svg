<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Mohammad Amawi — Software Engineering Student</title>
<desc id="desc">Third-year student learning full-stack web development. Animated orbital lines and flowing code signals on a dark navy background.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#080f21"/><stop offset="1" stop-color="#182448"/></linearGradient>
<linearGradient id="line"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".07"/></pattern>
<radialGradient id="halo"><stop stop-color="#6366f1" stop-opacity=".23"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
</defs>
<style>
.orbit{transform-origin:990px 195px;animation:turn 30s linear infinite}
.reverse{animation-direction:reverse;animation-duration:42s}
.signal{stroke-dasharray:12 380;animation:flow 8s linear infinite}
.cursor{animation:blink 1.5s steps(2,end) infinite}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-784}}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.orbit,.signal,.cursor{animation:none}}
</style>
<rect width="1200" height="390" rx="24" fill="url(#bg)"/>
<rect width="1200" height="390" rx="24" fill="url(#grid)"/>
<circle cx="990" cy="195" r="260" fill="url(#halo)"/>
<path d="M40 350H760Q800 350 800 310V80Q800 40 840 40H1160" fill="none" stroke="#334155"/>
<path class="signal" d="M40 350H760Q800 350 800 310V80Q800 40 840 40H1160" fill="none" stroke="#5eead4" stroke-width="2"/>
<g class="orbit" fill="none" stroke="#818cf8" stroke-opacity=".55"><ellipse cx="990" cy="195" rx="142" ry="75"/><circle cx="1132" cy="195" r="5" fill="#a78bfa" stroke="none"/></g>
<g class="orbit reverse" fill="none" stroke="#5eead4" stroke-opacity=".45"><ellipse cx="990" cy="195" rx="92" ry="142"/><circle cx="990" cy="53" r="5" fill="#5eead4" stroke="none"/></g>
<circle cx="990" cy="195" r="61" fill="#0f172a" stroke="#64748b" stroke-opacity=".5"/>
<text x="990" y="213" text-anchor="middle" font-family="monospace" font-size="47" font-weight="700" fill="#5eead4">&lt;/&gt;</text>
<g font-family="Segoe UI,Arial,sans-serif">
<rect x="55" y="51" width="227" height="29" rx="14" fill="#14323b"/>
<circle cx="72" cy="65" r="4" fill="#5eead4"/>
<text x="86" y="70" font-size="12" letter-spacing="1.5" fill="#99f6e4">LEARNING. BUILDING. GROWING.</text>
<text x="55" y="157" font-size="61" font-weight="750" fill="#f8fafc">Mohammad Amawi<tspan class="cursor" fill="#5eead4">_</tspan></text>
<text x="58" y="205" font-size="24" fill="#cbd5e1">Software Engineering Student</text>
<text x="58" y="242" font-size="18" fill="#94a3b8">Third year · JavaScript foundations · Full-stack learning</text>
<rect x="57" y="283" width="168" height="32" rx="8" fill="#17383b"/>
<text x="141" y="304" text-anchor="middle" font-size="13" fill="#99f6e4">NOW / JAVASCRIPT</text>
<rect x="238" y="283" width="145" height="32" rx="8" fill="#2c254b"/>
<text x="310" y="304" text-anchor="middle" font-size="13" fill="#ddd6fe">NEXT / .NET</text>
<text x="402" y="304" font-size="13" fill="#94a3b8">FUTURE / DEVOPS</text>
</g>
</svg>